<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <title>Qalculate Web Terminal</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./app.css">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body { overflow: hidden; background: #11151c; }
        #terminal { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; }
        #terminal .xterm { padding: 12px; }
        #terminal .xterm-viewport { overflow: hidden; }
    </style>
    <script>
        const coiReloadKey = "qalc-coi-reloaded";

        if (window.crossOriginIsolated) {
            sessionStorage.removeItem(coiReloadKey);
        } else {
            const isLivePreview = location.port === "3000";

            if (isLivePreview) {
                if ("serviceWorker" in navigator) {
                    navigator.serviceWorker.getRegistrations().then(registrations => {
                        for (const registration of registrations) registration.unregister();
                    });
                }
            } else if (location.hostname.endsWith("github.io") && "serviceWorker" in navigator) {
                navigator.serviceWorker.register("./coi-serviceworker.js", { scope: "./" }).then(() => {
                    const reloadOnce = () => {
                        if (!navigator.serviceWorker.controller) return;
                        if (sessionStorage.getItem(coiReloadKey)) return;
                        sessionStorage.setItem(coiReloadKey, "1");
                        location.reload();
                    };

                    if (navigator.serviceWorker.controller) {
                        reloadOnce();
                    } else {
                        navigator.serviceWorker.addEventListener("controllerchange", reloadOnce, { once: true });
                    }
                });
            }
        }
    </script>
</head>
<body>
    <main id="terminal" aria-label="Qalculate terminal"></main>
    <script type="module" src="./app.js"></script>
</body>
</html>
